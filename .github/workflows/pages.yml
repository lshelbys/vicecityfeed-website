name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Ensure Pages metadata
        run: |
          printf '%s\n' 'vicecityfeed.com' > out/CNAME
          touch out/.nojekyll
          test -s out/CNAME
          test -f out/.nojekyll
          test -f out/index.html
          echo '--- out/CNAME ---'
          cat out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Bind custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api --method PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type='workflow' \
            -f cname='vicecityfeed.com'; then
            echo "Custom domain rebound via API"
          else
            echo "::warning::Pages API cannot set CNAME (needs repo admin). In GitHub: Settings → Pages → Custom domain → enter vicecityfeed.com → Save. Wait for DNS check, then check Enforce HTTPS."
          fi
